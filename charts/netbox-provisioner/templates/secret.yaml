{{- $direct := dict -}}
{{- range (include "netbox-provisioner.secrets" . | fromJsonArray) -}}
{{- if .secret.value -}}
{{- $_ := set $direct .key .secret.value -}}
{{- end -}}
{{- end -}}
{{- if $direct }}
# the secret settings given as `value`
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "netbox-provisioner.fullname" . }}
  labels:
    {{- include "netbox-provisioner.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $direct }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
