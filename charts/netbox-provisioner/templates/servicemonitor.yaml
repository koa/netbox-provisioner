{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "netbox-provisioner.fullname" . }}
  labels:
    {{- include "netbox-provisioner.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "netbox-provisioner.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mgmt
  endpoints:
    - port: mgmt
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
