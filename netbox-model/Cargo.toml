[package]
name = "netbox-model"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = "1.0.219"
cynic = { version = "3.12", features = ["http-reqwest"] }
reqwest = "0.12.23"
config = "0.15.11"
lazy_static = "1.5.0"
thiserror = "2.0.16"
ipnet = "2.11"
self_cell = "1.2.0"

[build-dependencies]
cynic-codegen = { version = "3" }

[dev-dependencies]
insta = "1"
tokio = { version = "1.44.1", features = ["full"] }
anyhow = "1.0.97"
env_logger = "0.11.7"
serde_json = "1.0.145"
