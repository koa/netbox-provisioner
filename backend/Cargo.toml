[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
async-graphql = "7.0.16"
graphql_client = "0.16.0"
i18n = { path = "../i18n" }
serde = "1.0.219"
config = "0.15.11"
reqwest = { version = "0.12.15", features = ["json"] }
thiserror = "2.0.12"
tokio = { version = "1.44.1", features = ["sync", "rt", "time", "macros"] }
log = "0.4.26"
ipnet = { version = "2.11.0", features = ["serde"] }
regex = "1.11.1"
surge-ping = "0.8.2"
#encoding_rs = "0.8.35"
#mikrotik-api = { version = "0.1.0", git = "https://github.com/koa/mikrotik-api" }
#mikrotik-model = { version = "0.1.0", git = "https://github.com/koa/mikrotik-model" }
mikrotik-api = { version = "0.1.0", path = "../../mikrotik-api" }
mikrotik-model = { version = "0.1.0", path = "../../mikrotik-model" }
tokio-socks = "0.5.2"
russh = "0.64.1"
#lru = "0.13.0"
serde_json = "1.0.145"
rand = "0.9.0"

[dev-dependencies]
tokio = { version = "1.44.1", features = ["full"] }
anyhow = "1.0.97"
env_logger = "0.11.7"
sha2 = "0.10.8"
encoding_rs = "0.8.35"
tokio-stream = "0.1.17"
