[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
async-graphql = "7.2.1"
cynic = "3.14"
i18n = { path = "../i18n" }
serde = "1.0.229"
config = "0.15.27"
reqwest = { version = "0.13.5", features = ["json", "query"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "rt", "time", "macros"] }
log = "0.4.35"
ipnet = { version = "2.12.2", features = ["serde"] }
regex = "1.13.1"
surge-ping = "0.9.1"
#encoding_rs = "0.8.35"
# while a library is changed, `path = "../../<library>"` here, never committed (CLAUDE.md)
mikrotik-api = { version = "0.1.0", git = "https://github.com/koa/mikrotik-api", branch = "master" }
mikrotik-model = { version = "0.1.0", git = "https://github.com/koa/mikrotik-model", branch = "master" }
tokio-socks = "0.5.3"
russh = "0.65.1"
#lru = "0.13.0"
serde_json = "1.0.154"
rand = "0.10.3"
prometheus = "0.14.0"
# the devices' certificates for WebFig over HTTPS (`device::www_certificate`), with the
# crypto rustls brings already; x509-parser reads the CA's key identifier
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
x509-parser = "0.18"
time = "0.3"

[build-dependencies]
cynic-codegen = { version = "3.14", default-features = false }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full", "test-util"] }
anyhow = "1.0.104"
env_logger = "0.11.11"
sha2 = "0.11.1"
encoding_rs = "0.8.44"
tokio-stream = "0.1.19"
