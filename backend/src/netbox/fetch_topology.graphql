query FetchTopology{
    device_list{
        id
        name
        primary_ip4 {
            id
        }
        primary_ip6 {
            id
        }
        role {
            slug
        }
        interfaces{
            id
            name
            label
            ip_addresses{
                id
            }
            enabled
            type
            bridge {
                id
            }
            tags{
                slug
            }
            untagged_vlan {
                id
            }
            tagged_vlans{
                id
            }
            poe_mode
            rf_role
            rf_channel_frequency
            rf_channel_width
            wireless_link {
                ssid
                auth_type
                auth_psk
            }
        }
        frontports{
            id
            name
            mappings {
                rear_port {
                    id
                }
            }
        }
        rearports{
            id
            name
        }
        platform {
            name
        }
        tenant {
            id
        }
        location {
            tenant {
                id
            }
        }
        site{
            tenant{
                id
            }
        }
        serial
        custom_field_data
    }
    tenant_list{
        id
        custom_field_data
    }
    cable_list{
        id
        a_terminations {
            ...CableConnectionTermination
        }
        b_terminations {
            ...CableConnectionTermination
        }
    }
    wireless_lan_group_list {
        id
        custom_fields
        name
        wireless_lans {
            id
            ssid
            auth_type
            auth_psk
            vlan {
                id
            }
        }
    }
    vlan_group_list{
        id
        name
        custom_field_data
        vlans{
            id
            name
            vid
        }
    }
    ip_address_list{
        id,
        address,
    }
    prefix_list{
        id
        prefix
    }
    ip_range_list{
        id
        role {
            slug
        }
        start_address
        end_address
    }
}
fragment CableConnectionTermination on CableTerminationTerminationType{
    __typename
    ...ConnectedInterface
    ...ConnectedFrontPort
    ...ConnectedRearPort
}
fragment ConnectedInterface on InterfaceType{
    id
}
fragment ConnectedFrontPort on FrontPortType{
    id
}
fragment ConnectedRearPort on RearPortType{
    id
}