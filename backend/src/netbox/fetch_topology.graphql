query FetchTopology{
    device_list{
        id
        name
        primary_ip4 {
            id
        }
        primary_ip6 {
            id
        }
        role {
            slug
        }
        device_type {
            model
            manufacturer {
                slug
            }
        }
        interfaces{
            id
            name
            label
            ip_addresses{
                id
            }
            enabled
            type
            mtu
            speed
            duplex
            bridge {
                id
            }
            tags{
                slug
            }
            untagged_vlan {
                id
            }
            tagged_vlans{
                id
            }
            poe_mode
            poe_type
            # a lease client's (`device::ros::dhcp`); the MikroTiks' aren't kept in NetBox
            primary_mac_address {
                mac_address
            }
            rf_role
            rf_channel_frequency
            rf_channel_width
            tx_power
            wireless_link {
                id
                interface_a {
                    id
                }
                interface_b {
                    id
                }
                ssid
                auth_type
                auth_psk
                custom_field_data
            }
        }
        frontports{
            id
            name
            mappings {
                rear_port {
                    id
                }
            }
        }
        rearports{
            id
            name
        }
        platform {
            name
        }
        tenant {
            id
        }
        location {
            tenant {
                id
            }
        }
        site{
            id
            name
            tenant{
                id
            }
            region{
                ...RegionAncestry
            }
        }
        serial
        custom_field_data
        config_context
    }
    tenant_list{
        id
        custom_field_data
    }
    cable_list{
        id
        type
        a_terminations {
            ...CableConnectionTermination
        }
        b_terminations {
            ...CableConnectionTermination
        }
    }
    # a cable path goes on from one end of a circuit (a leased line, a fiber between
    # buildings) at its other end
    circuit_list {
        cid
        terminations {
            id
        }
    }
    wireless_lan_group_list {
        id
        custom_fields
        name
        wireless_lans {
            id
            ssid
            auth_type
            auth_psk
            vlan {
                id
            }
        }
    }
    vlan_group_list{
        id
        name
        custom_field_data
        vlans{
            id
            name
            vid
        }
    }
    ip_address_list{
        id,
        address,
    }
    prefix_list{
        id
        prefix
        description
        custom_field_data
        tags{
            slug
        }
        scope{
            __typename
            ... on SiteType{
                id
            }
        }
    }
    ip_range_list{
        id
        role {
            slug
        }
        start_address
        end_address
    }
}
fragment CableConnectionTermination on CableTerminationTerminationType{
    __typename
    ...ConnectedInterface
    ...ConnectedFrontPort
    ...ConnectedRearPort
    ...ConnectedCircuitTermination
}
fragment ConnectedInterface on InterfaceType{
    id
}
fragment ConnectedFrontPort on FrontPortType{
    id
}
fragment ConnectedRearPort on RearPortType{
    id
}
fragment ConnectedCircuitTermination on CircuitTerminationType{
    id
}
# Up to six levels of a site's region hierarchy: the topmost one is the country.
fragment RegionAncestry on RegionType {
    slug
    parent {
        slug
        parent {
            slug
            parent {
                slug
                parent {
                    slug
                    parent {
                        slug
                    }
                }
            }
        }
    }
}
