query InterfaceView($device: Int!){
    netboxUrl
    topology{
        deviceById(id: $device){
            interfaceView{
                rows{
                    task
                    interface{ ...Interface }
                    label
                    ports{ ...Interface }
                    portRows{ interface{ ...Interface } label farEnds{ ...Interface } actions{ ...Action } }
                    addresses{ ...Address }
                    ospf
                    dhcp
                    dhcpClient
                    nat
                    internet
                    mtu
                    untaggedVlan{ ...Vlan }
                    taggedVlans{ ...Vlan }
                    farEnds{ ...Interface }
                    radioPath{
                        routerPort{ ...Interface }
                        bridgePort{ ...Interface }
                        radio{ ...Interface }
                        ssid
                        peerRadio{ ...Interface }
                        peerBridgePort{ ...Interface }
                        peerRouterPort{ ...Interface }
                    }
                    gateways{ ...Device }
                    free
                    findings{ ...Finding }
                    actions{ ...Action }
                }
                deviceFindings{ ...Finding }
                otherFindings{ ...Finding }
                loopbackActions{ ...Action }
            }
        }
    }
}
fragment Finding on Finding{
    severity
    kind{
        __typename
        ... on PoolMissing{ pool version }
        ... on PoolNearlyFull{ pool version free size }
        ... on NoLoopback{ device{ ...Device } }
        ... on NoPrimaryIpv4{ device{ ...Device } }
        ... on PrimaryIpv4NotOnLoopback{
            device{ ...Device }
            address{ ...Address }
            interface{ ...Interface }
        }
        ... on AddressWithoutPrefix{ interface{ ...Interface } address{ ...Address } dhcp }
        ... on DhcpPoolEmpty{ interface{ ...Interface } address{ ...Address } prefix{ id prefix } }
        ... on PortLikeName{ interface{ ...Interface } }
        ... on RadioWithoutRole{ interface{ ...Interface } }
        ... on NatWithoutInternet{ interface{ ...Interface } }
        ... on LoopbackWithoutOspf{ device{ ...Device } address{ ...Address } }
        ... on VlanWithoutGroup{ interface{ ...Interface } vlan }
        ... on MtuMismatch{ interface{ ...Interface } mtu farEnd{ ...Interface } farMtu }
        ... on OspfOnOneEnd{ interface{ ...Interface } farEnd{ ...Interface } }
        ... on NoCommonSubnet{ interface{ ...Interface } farEnd{ ...Interface } }
        ... on AddressWithoutOspf{ interface{ ...Interface } farEnd{ ...Interface } }
        ... on WlanWithoutVlan{ id ssid group{ id name } }
        ... on VlanWithSeveralGateways{ vlan{ ...Vlan } interfaces{ ...Interface } }
        ... on VlanWithoutGateway{ vlan{ ...Vlan } interfaces{ ...Interface } }
        ... on TaggedVlanOnPort{ interface{ ...Interface } vlans{ ...Vlan } }
        ... on RadioPathIncomplete{ radio{ ...Interface } missing }
        ... on LabelNotFarEnd{ interface{ ...Interface } label farEnd{ ...Interface } }
        ... on VlanWithoutPort{ interface{ ...Interface } vlan{ ...Vlan } }
    }
}
fragment Action on RowAction{ kind helper interface peer{ ...Interface } vlan seen{ identity board interfaceName } address lease{ mac name } }
fragment Vlan on VlanRef{ id vid name }
fragment Device on DeviceRef{ id name site }
fragment Address on AddressRef{ id address }
fragment Interface on InterfaceRef{ id name device{ ...Device } }
