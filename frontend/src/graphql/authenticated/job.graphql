query JobEvents($id: Int!, $after: Int){
    job(id: $id){
        id
        kind
        state
        error { ...Problem }
        took
        events(after: $after){
            index
            at
            event {
                __typename
                ... on PoeChain { suppliers consumers }
                ... on WaitingForPower { device reason }
                ... on UpdateStart { version architecture packages }
                ... on UpdateStepPlanned { version files uninstall }
                ... on SshPasswordLogin { setting value restored }
                ... on PackageDownloaded { file bytes }
                ... on PackageUploaded { file }
                ... on Reboot { reason timeout }
                ... on RouterOsRunning { version }
                ... on FirmwareUpgrade { current upgrade running }
                ... on UpdateDone { from to }
                ... on ApplyPlanned { script }
                ... on FallbackArmed { delay }
                ... on ApplyRunning { timeout error { ...Problem } }
                ... on ApplyChecked { remaining error { ...Problem } }
                ... on FallbackStopped { after }
                ... on FallbackLeft { firesIn reason error { ...Problem } }
                ... on RadiosReprovisioned { menu count error { ...Problem } }
                ... on SetupStarted { neighbor neighborPort macs }
                ... on ConsoleOutput { text }
                ... on WaitingForApi { address timeout }
                ... on SetupDone { address }
                ... on DeviceModeConfirm { changes { feature reason } timeout }
                ... on DeviceModeChanged { changes { feature reason } }
                ... on RepartitionStarted { count files }
                ... on Repartitioned { partitions { name version sizeMib running } missingFiles }
            }
        }
    }
}
query DeviceJobs($deviceId: Int!){
    jobs(deviceId: $deviceId){
        id
        state
    }
}
mutation CancelJob($id: Int!){
    cancelJob(id: $id){
        id
    }
}
fragment Problem on ErrorInfo {
    code
    message
    params { name value }
}
