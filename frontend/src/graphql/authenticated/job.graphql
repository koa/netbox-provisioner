query JobEvents($id: Int!, $after: Int){
    job(id: $id){
        id
        kind
        state
        error { ...Problem }
        took
        events(after: $after){
            index
            at
            event {
                __typename
                ... on Connecting { device }
                ... on Connected { device address neighbor identity sameName }
                ... on UpdateTarget { version channel }
                ... on WatchdogNotSet { device }
                ... on PoeChain { suppliers consumers }
                ... on WaitingForPower { device reason }
                ... on UpdateStart { version architecture packages }
                ... on UpdateStepPlanned { version files uninstall }
                ... on SshPasswordLogin { setting value restored }
                ... on PackageDownloaded { file bytes }
                ... on PackageUploading { file bytes total }
                ... on PackageUploaded { file }
                ... on Reboot { reason timeout }
                ... on RouterOsRunning { version }
                ... on FirmwareUpgrade { current upgrade running }
                ... on UpdateDone { from to }
                ... on ApplyPlanned { script }
                ... on FallbackArmed { delay window radioWait }
                ... on FallbackUnavailable { deviceMode }
                ... on ApplyRunning { timeout error { ...Problem } }
                ... on ApplyWritten { lead }
                ... on ApplyStarted { startsIn error { ...Problem } }
                ... on ApplyChecked { remaining error { ...Problem } }
                ... on FallbackStopped { after }
                ... on FallbackLeft { firesIn reason error { ...Problem } }
                ... on FallbackFired { after }
                ... on ScriptProgress { lines section done errorLine error probe probeAnswered lost back rearmed afterFallback marks }
                ... on RadiosReprovisioned { menu count error { ...Problem } }
                ... on BatchApply { devices }
                ... on BatchStopped { device }
                ... on BatchIncomplete { devices notApplied }
                ... on SetupStarted { neighbor neighborPort macs }
                ... on ConsoleOutput { text }
                ... on WaitingForApi { address timeout }
                ... on SetupDone { address }
                ... on DeviceModeConfirm { changes { feature reason } timeout }
                ... on DeviceModeChanged { changes { feature reason } }
                ... on RepartitionStarted { count files }
                ... on Repartitioned { partitions { name version sizeMib running } missingFiles }
                ... on PartitionRunning { name version }
                ... on UpdateFallbackArmed { partition version delay }
                ... on UpdateFallbackDisarmed { partition }
                ... on UpdateWithoutFallback { partitions }
                ... on OspfNeighborsBack { neighbors }
                ... on WatchdogSuspended { device watching { watchAddress poePings { port address } } safetyNet }
                ... on WatchdogRestored { device watching { watchAddress poePings { port address } } }
                ... on WatchdogNotRestored { device watching { watchAddress poePings { port address } } error { ...Problem } }
                ... on WatchdogLeft { device error { ...Problem } }
                ... on WatchdogKept { device watching { watchAddress poePings { port address } } safetyNet }
                ... on NetboxWritten { path display deleted changes { field value previous } }
                ... on NetboxUndone { path display deleted recreated }
            }
        }
    }
}
query DeviceJobs($deviceId: Int!){
    jobs(deviceId: $deviceId){
        id
        state
    }
}
mutation CancelJob($id: Int!){
    cancelJob(id: $id){
        id
    }
}
fragment Problem on ErrorInfo {
    code
    message
    params { name value }
}
