query NetboxPlan($helper: Helper!){
    allowNetboxWrite
    netboxPlan(helper: $helper){
        fingerprint
        checkedWith
        undocumented{ address route gateway router }
        cutOff{ name }
        steps{
            __typename
            ... on CreateInterface{ name kind }
            ... on CreateAddress{ address device{ name } interface prefix }
            ... on SetPrimaryIp{ version address before }
            ... on CreateCable{ a{ name device{ name } } b{ name device{ name } } }
            ... on CreatePrefix{ prefix pool description }
            ... on UpdateInterface{ interface{ name device{ name } } label labelBefore mtu mtuBefore tagsAdded tagsRemoved }
            ... on DeleteCable{ port{ name device{ name } } far{ name device{ name } } }
            ... on DeleteAddress{ address interface{ name device{ name } } }
            ... on DeletePrefix{ prefix }
        }
    }
}
query NetboxPlanPreview($id: Int!, $helper: Helper!, $target: String, $credentialName: String, $adhocCredentials: AdhocCredentials){
    topology{
        deviceById(id: $id){
            findings{ kind{ __typename } }
        }
    }
    netboxPlan(helper: $helper){
        fingerprint
        preview{
            findings{ kind{ __typename } }
        }
        previewAccess(target: $target, credentialName: $credentialName, adhocCredentials: $adhocCredentials){
            generateCfg{ script }
        }
    }
}
mutation WriteNetboxPlan($helper: Helper!, $fingerprint: String!){
    writeNetboxPlan(helper: $helper, fingerprint: $fingerprint){ id }
}
mutation UndoNetboxWrite($jobId: Int!){
    undoNetboxWrite(jobId: $jobId){ id }
}
query HelperJobs($deviceId: Int!){
    jobs(deviceId: $deviceId){ id kind state }
}
query LinkPorts($id: Int!){
    topology{
        deviceById(id: $id){
            name
            linkPorts{ ...LinkPortFields }
        }
        allDevices(filter: { hasRouteros: true }){
            id
            name
            site{ name }
            linkPorts{ ...LinkPortFields }
        }
    }
}
fragment LinkPortFields on LinkPort{
    id name label mtu ospf ipv4 bridge cabled
    connected{ id name device{ id name } }
}
query FlagInterfaces($id: Int!){
    topology{
        deviceById(id: $id){
            flagInterfaces{
                id name label addresses bridge tags
                connected{ name device{ name } }
            }
        }
    }
}
