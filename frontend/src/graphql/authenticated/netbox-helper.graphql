query NetboxPlan($helper: Helper!){
    allowNetboxWrite
    netboxPlan(helper: $helper){
        fingerprint
        checkedWith
        undocumented{ address route gateway router }
        cutOff{ name }
        applyTogether{ name }
        steps{
            __typename
            ... on CreateInterface{ name kind tags }
            ... on CreateAddress{ address device{ name } interface prefix }
            ... on SetPrimaryIp{ version address before }
            ... on CreateCable{ a{ name device{ name } } b{ name device{ name } } }
            ... on CreatePrefix{ prefix pool description }
            ... on UpdateInterface{ interface{ name device{ name } } label labelBefore mtu mtuBefore tagsAdded tagsRemoved poe poeBefore }
            ... on DeleteCable{ port{ name device{ name } } far{ name device{ name } } }
            ... on DeleteAddress{ address interface{ name device{ name } } }
            ... on DeletePrefix{ prefix }
            ... on UpdatePort{ interface{ name device{ name } } name rfRole rfRoleBefore bridge }
            ... on CreateWirelessLink{ a{ name device{ name } } b{ name device{ name } } ssid }
            ... on UpdateWirelessLink{ a{ name device{ name } } b{ name device{ name } } ssid ssidBefore pskSet }
            ... on DeleteWirelessLink{ a{ name device{ name } } b{ name device{ name } } }
        }
    }
}
query NetboxPlanPreview($id: Int!, $helper: Helper!, $target: String, $credentialName: String, $adhocCredentials: AdhocCredentials){
    topology{
        deviceById(id: $id){
            findings{ kind{ __typename } }
        }
    }
    netboxPlan(helper: $helper){
        fingerprint
        preview{
            findings{ kind{ __typename } }
        }
        previewAccess(target: $target, credentialName: $credentialName, adhocCredentials: $adhocCredentials){
            generateCfg{ script }
        }
    }
}
mutation WriteNetboxPlan($helper: Helper!, $fingerprint: String!){
    writeNetboxPlan(helper: $helper, fingerprint: $fingerprint){ id }
}
mutation UndoNetboxWrite($jobId: Int!){
    undoNetboxWrite(jobId: $jobId){ id }
}
query HelperJobs($deviceId: Int!){
    jobs(deviceId: $deviceId){ id kind state }
}
query LinkPorts($id: Int!){
    topology{
        deviceById(id: $id){
            name
            linkPorts{ ...LinkPortFields }
        }
        allDevices(filter: { hasRouteros: true }){
            id
            name
            site{ name }
            linkPorts{ ...LinkPortFields }
        }
    }
}
fragment LinkPortFields on LinkPort{
    id name label mtu ospf ipv4 bridge cabled
    connected{ id name device{ id name } }
}
query FlagInterfaces($id: Int!){
    topology{
        deviceById(id: $id){
            flagInterfaces{
                id name label addresses bridge tags
                connected{ name device{ name } }
            }
        }
    }
}
query PoeOptions($id: Int!){
    topology{
        deviceById(id: $id){
            poeOptions{
                ports{ ...PoePortFields }
                peers{ id name ports{ ...PoePortFields } }
            }
        }
    }
}
fragment PoePortFields on PoePort{
    id name label poe cabled
    connected{ id name device{ id name } }
}
query PoeObserved($id: Int!, $target: String, $credentialName: String, $adhocCredentials: AdhocCredentials){
    topology{
        deviceById(id: $id){
            access(target: $target, credentialName: $credentialName, adhocCredentials: $adhocCredentials){
                poeObserved{
                    port{ name interface{ id name } }
                    far{ id name device{ id name } }
                    fromNeighbor
                }
            }
        }
    }
}
query RadioBridgeCandidates($id: Int!){
    topology{
        deviceById(id: $id){
            radioBridgeCandidates{
                device{ id name }
                radio{ id name }
                role
                peer{ id name }
                routerPort{ id name device{ id name } }
                address
            }
        }
    }
}
query CustomerNetOptions($id: Int!){
    topology{
        deviceById(id: $id){
            customerNetOptions{
                interfaces{ id name label }
                vlans{ id name vid interface }
                parents{ id prefix }
                parentsV6{ id prefix }
            }
        }
    }
}
