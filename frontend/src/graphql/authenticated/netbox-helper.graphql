query NetboxPlan($helper: Helper!){
    allowNetboxWrite
    netboxPlan(helper: $helper){
        fingerprint
        checkedWith
        undocumented{ address route gateway router }
        cutOff{ name }
        applyTogether{ name }
        emptiedBridge{ name }
        steps{
            __typename
            ... on CreateDevice{ name site deviceType role wlanGroup }
            ... on CreateInterface{ name kind tags mac device{ name } }
            ... on CreateAddress{ address device{ name } interface prefix }
            ... on SetPrimaryIp{ version address before device{ name } }
            ... on CreateCable{ a{ name device{ name } } b{ name device{ name } } }
            ... on CreatePrefix{ prefix pool description dhcpLeaseTime }
            ... on UpdateInterface{ interface{ name device{ name } } label labelBefore mtu mtuBefore tagsAdded tagsRemoved poe poeBefore poeRemoved }
            ... on DeleteCable{ port{ name device{ name } } far{ name device{ name } } }
            ... on DeleteAddress{ address interface{ name device{ name } } }
            ... on DeletePrefix{ prefix }
            ... on UpdatePort{ interface{ name device{ name } } name rfRole rfRoleBefore bridge leavesBridge }
            ... on CreateWirelessLink{ a{ name device{ name } } b{ name device{ name } } ssid }
            ... on UpdateWirelessLink{ a{ name device{ name } } b{ name device{ name } } ssid ssidBefore pskSet }
            ... on DeleteWirelessLink{ a{ name device{ name } } b{ name device{ name } } }
            ... on UpdatePortVlan{ interface{ name device{ name } } vlan{ ...PlanVlan } vlanBefore{ ...PlanVlan } taggedBefore{ ...PlanVlan } }
            ... on DeleteInterface{ interface{ name device{ name } } }
        }
    }
}
query NetboxPlanPreview($id: Int!, $helper: Helper!, $target: String, $credentialName: String, $adhocCredentials: AdhocCredentials){
    topology{
        deviceById(id: $id){
            findings{ kind{ __typename } }
        }
    }
    netboxPlan(helper: $helper){
        fingerprint
        preview{
            findings{ kind{ __typename } }
        }
        previewAccess(target: $target, credentialName: $credentialName, adhocCredentials: $adhocCredentials){
            generateCfg{ script }
        }
    }
}
mutation WriteNetboxPlan($helper: Helper!, $fingerprint: String!){
    writeNetboxPlan(helper: $helper, fingerprint: $fingerprint){ id }
}
mutation UndoNetboxWrite($jobId: Int!){
    undoNetboxWrite(jobId: $jobId){ id }
}
query HelperJobs($deviceId: Int!){
    jobs(deviceId: $deviceId){ id kind state netboxWrittenCount }
}
fragment PlanVlan on VlanRef{ vid name }
