query InterfaceLive($id: Int!, $target: String, $credentialName: String, $adhocCredentials: AdhocCredentials){
    topology{
        deviceById(id: $id){
            access(target: $target, credentialName: $credentialName, adhocCredentials: $adhocCredentials){
                interfaceLive{
                    rows{
                        interface
                        seen{ ...Seen }
                        ospf{ instance address routerId state adjacent device{ ...Device } }
                        ospfMissing{ ...Device }
                        bridges{ device{ ...Device } address answers }
                        findings{ ...NeighborFinding }
                        deviceOnlyAddresses{ ...DeviceOnly }
                        deviceOnlyLeases{ ...DeviceOnlyLease }
                        actions{ kind helper interface peer{ ...Interface } vlan seen{ identity board interfaceName } address lease{ mac name } }
                    }
                    otherFindings{ ...NeighborFinding }
                    otherAddresses{ ...DeviceOnly }
                    otherLeases{ ...DeviceOnlyLease }
                }
            }
        }
    }
}
fragment NeighborFinding on NeighborFinding{
    severity
    kind{
        __typename
        ... on CableMissing{ port{ ...Port } seen{ ...Seen } }
        ... on CableElsewhere{ port{ ...Port } farEnd{ ...Interface } seen{ ...Seen } }
        ... on OtherFarPort{ port{ ...Port } farEnd{ ...Interface } seen{ ...Seen } }
        ... on NeighborNotSeen{ port{ ...Port } farEnd{ ...Interface } }
        ... on NeighborsNotInNetbox{ port{ ...Port } seen{ ...Seen } }
        ... on DiscoveryOff{ list }
    }
}
fragment DeviceOnly on DeviceOnlyAddress{ address interfaceName disabled elsewhere{ ...Device } unassigned }
fragment DeviceOnlyLease on DeviceOnlyLease{ address mac clientId server name disabled settings elsewhere{ ...Device } unassigned }
fragment Device on DeviceRef{ id name site }
fragment Interface on InterfaceRef{ id name device{ ...Device } }
fragment Port on PortRef{ name interface{ ...Interface } }
fragment Seen on SeenNeighbor{ identity interfaceName board device{ ...Device } interface{ ...Interface } }
