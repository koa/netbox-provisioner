query NetworkMap($site: Int){
    topology{
        networkState(siteId: $site){
            readFrom{ id name }
            age
            error
            outside
            outsideAt
            nodes{
                device{ id name site }
                routeros
                state
                health{ name value unit }
                resources{ uptime cpuLoad freeMemory totalMemory freeHddSpace version }
            }
            edges{
                kind
                a{ id name device{ id name } }
                b{ id name device{ id name } }
                state
                reason
                reasonDevice
            }
            poeEdges{
                pse{ id name device{ id name } }
                pd{ id name device{ id name } }
                status
                power
                problem
            }
        }
    }
}
