query NetworkMap($site: Int){
    allowNetboxWrite
    topology{
        networkState(siteId: $site){
            readFrom{ id name }
            age
            error
            outside
            outsideAt
            nodes{
                device{ id name site }
                routeros
                state
                siteName
                position{ x y }
            }
            edges{
                kind
                a{ id name device{ id name } }
                b{ id name device{ id name } }
                state
                reason
                reasonDevice
            }
        }
    }
}
mutation PublishLayout($positions: [DevicePositionInput!]!){
    publishLayout(positions: $positions)
}
