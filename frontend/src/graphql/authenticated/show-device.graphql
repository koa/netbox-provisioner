mutation BootPartition($id: Int!, $partition: String!, $target: String, $credentialName: String, $adhocCredentials: AdhocCredentials){
    bootPartition(id: $id, partition: $partition, target: $target, credentialName: $credentialName, adhocCredentials: $adhocCredentials){
