    }
}
mutation UpdateRouteros($id: Int!, $channel: Channel, $target: String, $credentialName: String, $adhocCredentials: AdhocCredentials, $suspendWatchdogs: Boolean, $withoutFallback: Boolean){
    updateRouteros(id: $id, channel: $channel, target: $target, credentialName: $credentialName, adhocCredentials: $adhocCredentials, suspendWatchdogs: $suspendWatchdogs, withoutFallback: $withoutFallback){
        id
    }
}
mutation DowngradeRouteros($id: Int!, $version: String!, $target: String, $credentialName: String, $adhocCredentials: AdhocCredentials, $suspendWatchdogs: Boolean, $withoutFallback: Boolean){
    downgradeRouteros(id: $id, version: $version, target: $target, credentialName: $credentialName, adhocCredentials: $adhocCredentials, suspendWatchdogs: $suspendWatchdogs, withoutFallback: $withoutFallback){
        id
    }
}
mutation ClearLeftover($id: Int!, $action: LeftoverAction!, $target: String, $credentialName: String, $adhocCredentials: AdhocCredentials){
    clearLeftover(id: $id, action: $action, target: $target, credentialName: $credentialName, adhocCredentials: $adhocCredentials){
