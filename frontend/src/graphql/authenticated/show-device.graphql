query DeviceOverview($id: Int!, $target: String, $credentialName: String, $adhocCredentials: AdhocCredentials){
    allowApply
    topology{
        deviceById(id: $id){
            name
            bootstrapPlan {
                neighbor
                neighborPort
                port
                address
            }
            bootstrapProblem { ...Problem }
            updateNeighbors
            powerSupply { device { id name } port }
            watchdogs { device supplier watching { watchAddress poePings { port address } } problem { ...Problem } }
            access(target: $target, credentialName: $credentialName, adhocCredentials: $adhocCredentials){
                connected { address neighbor identity sameName }
                deviceStats{
                    routerboard {
                        deviceType
                        firmwareType
                        serialNumber
                    }
                }
                generateCfg {
                    script
                    warnings {
                        __typename
                        ... on PoeCut { port defaultName }
                        ... on RadioBound { radio configuration expected }
                        ... on CapOffOutsideWlanGroup { package }
                        ... on WatchTargetSilent { address port device }
                        ... on ApiClientsOutside { clients }
                    }
                }
                deviceMode {
                    mode
                    changes { feature reason }
                }
                partitions {
                    partitions { name version sizeMib active running }
                    canSplit
                }
                leftovers {
                    applyFallback { nextRun }
                    updateFallback { nextRun }
                    watchdogs { nextRun watching { watchAddress poePings { port address } } heldBy { job device } }
                    applyScriptRunning
                    packages { file size }
                }
                log { time topics message }
                routeros {
                    version
                    packages
                    wanted
                    defaultChannel
                    adjustPackages
                    previous
                    channels {
                        channel
                        newest
                        upgrade
                        update
                    }
                }
            }
        }
    }
}
mutation ApplyDeviceCfg($id: Int!, $target: String, $credentialName: String, $adhocCredentials: AdhocCredentials){
    applyCfg(id: $id, target: $target, credentialName: $credentialName, adhocCredentials: $adhocCredentials){
        id
    }
}
query BootstrapCandidates($id: Int!){
    topology{
        deviceById(id: $id){
            bootstrapPlan {
                discovered {
                    mac
                    identity
                    board
                    version
                    interface
                }
            }
        }
    }
}
mutation BootstrapDevice($id: Int!, $mac: ScalarMac!){
    bootstrap(id: $id, mac: $mac){
        id
    }
}
mutation PowerCycle($id: Int!){
    powerCycle(id: $id){
        id
    }
}
mutation RebootDevice($id: Int!, $target: String, $credentialName: String, $adhocCredentials: AdhocCredentials){
    rebootDevice(id: $id, target: $target, credentialName: $credentialName, adhocCredentials: $adhocCredentials){
