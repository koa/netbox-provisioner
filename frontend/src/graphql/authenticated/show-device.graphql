query DeviceOverview($id: Int!, $target: String, $credentialName: String, $adhocCredentials: AdhocCredentials){
    allowApply
    topology{
        deviceById(id: $id){
            name
            bootstrapPlan {
                neighbor
                neighborPort
                port
                address
            }
            bootstrapProblem
            access(target: $target, credentialName: $credentialName, adhocCredentials: $adhocCredentials){
                deviceStats{
                    routerboard {
                        deviceType
                        firmwareType
                        serialNumber
                    }
                }
                generateCfg {
                    script
                    warnings {
                        __typename
                        ... on PoeCut { port defaultName }
                        ... on RadioBound { radio configuration expected }
                    }
                }
                routeros {
                    version
                    packages
                    wanted
                    defaultChannel
                    adjustPackages
                    channels {
                        channel
                        newest
                        upgrade
                        update
                    }
                }
            }
        }
    }
}
mutation ApplyDeviceCfg($id: Int!, $target: String, $credentialName: String, $adhocCredentials: AdhocCredentials){
    applyCfg(id: $id, target: $target, credentialName: $credentialName, adhocCredentials: $adhocCredentials){
        id
    }
}
query BootstrapCandidates($id: Int!){
    topology{
        deviceById(id: $id){
            bootstrapPlan {
                discovered {
                    mac
                    identity
                    board
                    version
                    interface
                }
            }
        }
    }
}
mutation BootstrapDevice($id: Int!, $mac: ScalarMac!){
    bootstrap(id: $id, mac: $mac){
        id
    }
}
mutation RebootDevice($id: Int!, $target: String, $credentialName: String, $adhocCredentials: AdhocCredentials){
    rebootDevice(id: $id, target: $target, credentialName: $credentialName, adhocCredentials: $adhocCredentials){
        id
    }
}
mutation UpdateRouteros($id: Int!, $channel: Channel, $target: String, $credentialName: String, $adhocCredentials: AdhocCredentials){
    updateRouteros(id: $id, channel: $channel, target: $target, credentialName: $credentialName, adhocCredentials: $adhocCredentials){
        id
    }
}
