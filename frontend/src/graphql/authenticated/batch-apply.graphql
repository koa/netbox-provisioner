query BatchCandidates($id: Int!){
    topology{
        deviceById(id: $id){
            batchCandidates {
                partner
                device { id name site { id name } }
            }
        }
    }
}
query BatchDevice($id: Int!){
    topology{
        deviceById(id: $id){
            access {
                connected { address neighbor identity sameName }
                generateCfg {
                    script
                    warnings {
                        __typename
                        ... on PoeCut { port defaultName }
                        ... on RadioBound { radio configuration expected }
                        ... on CapOffOutsideWlanGroup { package }
                        ... on WatchTargetSilent { address port device }
                        ... on ApiClientsOutside { clients }
                    }
                }
            }
        }
    }
}
mutation ApplyBatch($ids: [Int!]!){
    applyBatch(ids: $ids){
        id
        deviceId
        deviceName
    }
}
