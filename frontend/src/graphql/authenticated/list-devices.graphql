query ListSites{
    topology{
        allSites{
            id
            name
            devices{
                id
                name
            }
        }
    }
}
query SiteDevices($site: Int!){
    topology{
        siteById(id: $site){
            devices{
                id
                name
                managementAddress{
                    address {
                        ip
                    }
                }
                serial
            }
        }
    }
}
query PingDevice($id: Int!){
    topology{
        deviceById(id: $id){
            access{
                ping{
                    duration
                }
                deviceStats{
                    routerboard {
                        deviceType
                        serialNumber
                    }
                }
            }
        }
    }
}
