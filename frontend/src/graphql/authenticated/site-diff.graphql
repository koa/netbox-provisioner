mutation DiffSite($site: Int!){
    diffSite(siteId: $site){
        id
    }
}
query SiteDiffJobs($site: Int!){
    jobs(siteId: $site){
        id
        kind
    }
}
subscription SiteDiffKnown($site: Int!){
    topology{
        siteById(id: $site){
            devices{
                id
                knownDiff{
                    menus { menu added changed removed }
                    error { ...Problem }
                    age
                    changedAge
                }
            }
        }
    }
}
query SiteDiffEvents($id: Int!, $after: Int){
    job(id: $id){
        state
        age
        error { ...Problem }
        events(after: $after){
            index
            event {
                __typename
                ... on SiteDiffStarted { devices { id name } }
                ... on DeviceDiffed {
                    device { id name }
                    menus { menu added changed removed }
                    error { ...Problem }
                }
            }
        }
    }
}
fragment Problem on ErrorInfo {
    code
    message
    params { name value }
}
