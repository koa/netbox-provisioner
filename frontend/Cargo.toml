[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4"
yew = { version = "0.23.0", features = ["csr"] }
yew-nested-router = { version = "0.9.0" }
patternfly-yew = { version = "0.8" }
graphql_client = { version = "0.15.0", features = ["reqwest-rustls"], git = "https://github.com/Chrisss93/graphql-client", branch = "reqwest-upgrade" }
reqwest = { version = "0.12.12" }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
log = "0.4"
wasm-logger = "0.2.0"
web-sys = { version = "0.3.77", features = ["Element", "HtmlElement", "Location", "Node", "NodeList", "Window"] }
thiserror = "2.0.11"
yew-oauth2 = { version = "0.14", features = ["openid"] }
lazy_static = "1.5.0"
console_error_panic_hook = "0.1.7"
gloo = "0.11.0"

[build-dependencies]
backend = { path = "../backend" }
anyhow = "1.0.96"