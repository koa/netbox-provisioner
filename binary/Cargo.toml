[package]
name = "binary"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-web-static-files = "4"
backend = { path = "../backend" }
async-graphql = "7.0.15"
async-graphql-actix-web = "7.0.15"
env_logger = "0.11.6"
log = "0.4"
prometheus = "0.14.0"
actix-web-prom = { version = "0.10.0", features = ["process"] }
thiserror = "2.0.11"
# rustls 0.23 for fetching the issuer's keys; its default is rustls 0.20 with ring 0.16
actix-4-jwt-auth = { version = "1.2.9", default-features = false, features = ["rustls-0_23-native-roots"] }
# the `Duration` of biscuit's `TemporalOptions`
chrono = { version = "0.4", default-features = false }
tracing-actix-web = "0.7"
tracing = { version = "0.1", features = ["log"] }
serde = "1.0.218"
serde_json = "1.0.139"
futures-util = "0.3.31"
include_dir = "0.7.4"
mime_guess = "2.0.5"

[build-dependencies]