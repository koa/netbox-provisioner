# Tests, clippy and the image on every push; a push to master publishes image and chart as a
# snapshot (image `sha-<commit>`), a tag `vX.Y.Z` as the release X.Y.Z; cleanup.yaml removes
# old snapshots (docs/concepts/deployment.md).
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/netbox-provisioner
  CHARTS: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # tests (without the `#[ignore]` CHR tests), the three clippy runs, no shell in the image
      - name: checks
        run: nix flake check -L
      - name: image
        run: nix build -L .#image --out-link image.tar.gz
      - name: chart
        run: |
          nix shell nixpkgs#kubernetes-helm -c \
            helm lint charts/netbox-provisioner -f charts/netbox-provisioner/ci/lint-values.yaml

      # the chart's version in Chart.yaml is the next release; a snapshot is a prerelease of it,
      # ordered by time: 0.2.0-snapshot.20261024123456.sha-abc1234
      - name: publish snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base="$(sed -n 's/^version: *//p' charts/netbox-provisioner/Chart.yaml)"
          stamp="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M%S)"
          .github/scripts/publish.sh "sha-${GITHUB_SHA::7}" "$base-snapshot.$stamp.sha-${GITHUB_SHA::7}"

      - name: publish release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish.sh "${GITHUB_REF_NAME#v}" "${GITHUB_REF_NAME#v}"
