# Tests, clippy and the image on every push; a push to master publishes image and chart as a
# snapshot (image `sha-<full commit id>`), a tag `vX.Y.Z` as the release X.Y.Z; cleanup.yaml removes
# old snapshots (docs/deployment.md).
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/netbox-provisioner
  CHARTS: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      # the nix store between runs, path by path in the GitHub Actions cache: with the crates'
      # dependencies built apart (flake.nix), a run builds only what changed
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false
      # tests (without the `#[ignore]` CHR tests), the three clippy runs, no shell in the image
      - name: checks
        run: nix flake check -L
      - name: image
        run: nix build -L .#image --out-link image.tar.gz
      - name: chart
        run: |
          nix shell nixpkgs#kubernetes-helm -c \
            helm lint charts/netbox-provisioner -f charts/netbox-provisioner/ci/lint-values.yaml

      # the chart's version in Chart.yaml is the next release; a snapshot is a prerelease of it,
      # named by the full commit id, which git knows locally: 0.2.0-snapshot.sha-<40 hex>
      - name: publish snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base="$(sed -n 's/^version: *//p' charts/netbox-provisioner/Chart.yaml)"
          .github/scripts/publish.sh "sha-$GITHUB_SHA" "$base-snapshot.sha-$GITHUB_SHA"

      - name: publish release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish.sh "${GITHUB_REF_NAME#v}" "${GITHUB_REF_NAME#v}"
